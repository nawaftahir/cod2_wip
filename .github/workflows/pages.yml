name: progress page

# Rebuilds after main changes, or after any target's CI passes on its <target>/main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [radiant, client, gfx, servers]
    types: [completed]
    branches: ['**/main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          lfs: false
      - run: python3 tools/dashboard/build.py --test && python3 tools/dashboard/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
