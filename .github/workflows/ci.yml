name: radiant
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cod2-radiant-msvc71:1

jobs:
  gate:
    # the compiler image is i386, so GitHub's own actions run on the host and the image runs via docker
    runs-on: ubuntu-latest
    outputs:
      sha_identical: ${{ steps.gate.outputs.sha_identical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pull compiler image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$IMAGE"
      - name: Previous numbers
        run: git show HEAD~1:ledger/meter.json > ledger/meter.json 2>/dev/null || git checkout -- ledger/meter.json || true
      - id: gate
        name: Verify every ledger row + meters
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" sh -c \
            'python3 tools/verify.py --all > build-verify.log 2>&1; python3 tools/link.py > link.log 2>&1; python3 tools/sections.py > sections.log 2>&1; python3 tools/meter.py --gate > meter.log 2>&1; echo $? > meter.rc'
          rc=$(cat meter.rc)
          cat build-verify.log meter.log
          # what this push added, from the ledger diff (HEAD~1 = previous main)
          git diff HEAD~1 HEAD -- ledger/matches.tsv | grep '^+0x' | cut -c2- | awk -F'\t' '{printf "- `%s` %s (%s bytes, %s)\n", $1, $5, $2, $3}' > new.md || true
          git diff HEAD~1 HEAD -- ledger/defer.tsv | grep '^+0x' | cut -c2- | awk -F'\t' '{printf "- `%s` deferred by %s: %s\n", $1, $2, substr($4,1,90)}' > deferred.md || true
          agent=$(git log -1 --format=%s | sed -n 's/^land \([a-z]*\).*/\1/p')
          queue_left=$(awk -F'\t' 'NR==FNR{d[$1]=1;next} FNR>1 && !($3 in d)' <(cut -f1 ledger/matches.tsv ledger/defer.tsv) queue/queue.tsv | wc -l)
          {
            echo "**by:** ${agent:-owner}  **new matches:** $(wc -l < new.md)  **deferred:** $(wc -l < deferred.md)  **queue left:** $queue_left  **total deferred:** $(( $(grep -c . ledger/defer.tsv) - 1 ))"
            echo
            cat build/summary.md
            if [ -s new.md ]; then echo; echo "**New matches**"; head -12 new.md; fi
            if [ -s deferred.md ]; then echo; echo "**Deferred**"; head -5 deferred.md; fi
            echo; echo '**Rebuilt exe vs retail**'; echo '```'; cat link.log sections.log; echo '```'
            echo; echo '```'; grep -v '^verify:' build-verify.log | grep -v '^UNVERIFIED' | head -30; tail -1 build-verify.log; echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "sha_identical=$(jq -r .sha_identical build/meter.json)" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary
          path: summary.md

  report:
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: summary
      - name: Commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.gate.result }}
        run: |
          { echo "**radiant CI: $RESULT**"; echo; cat summary.md; } > body.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@body.md > /dev/null
      - name: Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RESULT: ${{ needs.gate.result }}
          MSG: ${{ github.event.head_commit.message }}
        if: env.HOOK != ''
        run: |
          icon=$([ "$RESULT" = success ] && echo "✅" || echo "❌")
          head_line=$(head -1 summary.md)
          table=$(grep '^| ' summary.md | tail -n +3 | sed 's/^| //; s/ |$//; s/ | /: **/; s/$/**/; s/^/• /')
          extra=$(sed -n '/^\*\*New matches\*\*/,/^```/p; /^\*\*Deferred\*\*/,/^```/p' summary.md | grep -v '^```' | head -20)
          text=$(printf '%s **CoD2Radiant** `%s` %s\n%s\n\n%s\n\n%s\n<%s>' "$icon" "${GITHUB_SHA::7}" "$(echo "$MSG" | head -1)" \
            "$head_line" "$table" "$extra" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          text=${text:0:1990}
          jq -n --arg c "$text" '{content: $c}' | curl -fsS -H 'Content-Type: application/json' -d @- "$HOOK"
      - name: Tag the first SHA-identical build
        if: needs.gate.outputs.sha_identical == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view sha-identical -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create sha-identical -R "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "SHA-identical CoD2Radiant.exe" --notes "Rebuilt exe matches retail SHA-256."
